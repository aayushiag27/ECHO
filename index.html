<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO Music Festival</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <video class="bg-video" autoplay muted loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <header>
        <nav>
            <div>
                <a href="#">Home</a>
                <a href="#">Artists</a>
                <a href="#">Schedule</a>
                <a href="#">Tickets</a>
            </div>
        </nav>

        <h1>ECHO</h1>
        <p>Music Festival</p>
        <p>Live Music • Multiple Artists • One Stage</p>
        <button type="button">Get Tickets</button>
    </header>

    <main>
        <section id="artists">
            <h2>Artists</h2>

            <div class="artists-grid">
                <article>
                    <h3>Artist One</h3>
                    <p>Electronic</p>
                </article>

                <article>
                    <h3>Artist Two</h3>
                    <p>Indie</p>
                </article>

                <article>
                    <h3>Artist Three</h3>
                    <p>Alternative</p>
                </article>
            </div>
        </section>
    </main>

</body>

</html>
